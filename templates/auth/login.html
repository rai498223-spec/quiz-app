{% extends 'base.html' %}
{% block auth_content %}
<div class="auth-card">
    <h1>Welcome back</h1>
    <p>Log in to keep your day on track.</p>
    <form method="post">
        {% csrf_token %}
        <div class="field-row">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required>
        </div>
        <div class="field-row">
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required>
        </div>
        <button type="submit" class="primary-btn">Log in</button>
    </form>
    <p class="auth-link">Need an account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
