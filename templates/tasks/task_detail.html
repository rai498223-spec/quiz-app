{% extends 'base.html' %}
{% block content %}
<div class="panel">
    <div class="section-header">
        <h1>{{ task.title }}</h1>
        <span class="priority-badge priority-{{ task.priority|lower }}">{{ task.priority }}</span>
    </div>
    <p>{{ task.description|default:'No description provided.' }}</p>
    <div class="stats-grid">
        <div class="stat-card panel"><span>Status</span><strong>{{ task.status }}</strong></div>
        <div class="stat-card panel"><span>Duration</span><strong>{{ task.duration_display }}</strong></div>
        <div class="stat-card panel"><span>Deadline</span><strong>{{ task.deadline|date:'M d, Y'|default:'No deadline' }}</strong></div>
    </div>
    <div class="card-actions">
        <a href="{% url 'task_update' task.pk %}" class="secondary-btn">Edit</a>
        <a href="{% url 'task_delete' task.pk %}" class="primary-btn" onclick="return confirm('Delete this task?')">Delete</a>
    </div>
</div>
{% endblock %}
